# Bun is the runtime and the toolchain (docs/DECISIONS.md).

[install]
# Every dependency is pinned to the version ARCHITECTURE.md §14 checked.
exact = true

[fmt]
printWidth = 120
semi = false

[test]
# `bun test` from ts/ finds every package's tests; `bun test <dir>` runs one package.
root = "."
coverageSkipTestFiles = true
