# Bun is the runtime and the toolchain: it installs, builds, formats and tests.

[install]
# Every dependency is pinned to an exact version.
exact = true

[fmt]
printWidth = 120
semi = false

[test]
# `bun test` from web/ finds every package's tests; `bun test <dir>` runs one package.
root = "."
coverageSkipTestFiles = true
