# The toolchain and every task, for development and CI alike.

[tools]
rust = { version = "1.99", components = "clippy,rustfmt" }
# Builds the web UI the binary embeds (`mise run ui`); as ts/ pins it.
bun = "1.4.4"

[tasks.build]
description = "Build an optimized release binary"
run = "cargo build --release --locked"

[tasks.check]
description = "Format check, lint, and test"
run = [
  "cargo fmt --all --check",
  "cargo clippy --all-targets --all-features --locked -- -D warnings",
  "cargo test --locked",
  # Day boundaries across a daylight saving change, in a zone that has one.
  "TZ=America/New_York cargo test --locked -p slopmax-common local_midnight",
]

[tasks.ui]
description = "Build the web UI the binary embeds, into ts/apps/ui/dist/rust"
dir = "ts"
run = ["bun install --frozen-lockfile", "bun apps/ui/build.ts --rust"]

[tasks.msrv]
description = "Check that the minimum supported Rust version still builds"
tools = { rust = "1.89" }
run = "cargo check --all-targets --all-features --locked"

[tasks.budget]
description = "Hold the binary's dependencies to 70 crates and the binary to 7 MiB"
run = '''
host=$(rustc -vV | sed -n 's/host: //p')
# Third-party crates only: slopmax's own (path) crates are left out.
crates=$(cargo tree --locked --color never -e normal --target "$host" --prefix none -p slopmax | sed 's/ (\*)//' | grep -v ' (/' | sort -u)
count=$(printf '%s\n' "$crates" | wc -l | tr -d ' ')
echo "$count crates for $host (budget 70)"
[ "$count" -le 70 ] || { printf '%s\n' "$crates"; exit 1; }
cargo build --release --locked -p slopmax
bytes=$(wc -c < target/release/slopmax | tr -d ' ')
# 7 MiB, ARCHITECTURE-NEXT.md's hard budget from phase 3 on: v0.3.0
# measured 6.52 MB, the typed API added 0.39 MB. Raising it needs the
# reason in the commit.
echo "$bytes bytes (budget 7340032)"
[ "$bytes" -le 7340032 ]
'''

[tasks.bench]
description = "Measure the latency, throughput, memory, and startup slopmax adds"
tools = { oha = "1.16", jq = "1.8", hyperfine = "1.20" }
run = "scripts/bench.sh"

[tasks.install]
description = "Install slopmax into ~/.cargo/bin"
run = "cargo install --path crates/slopmax --locked"

[tasks.demo]
description = "Run a throwaway slopmax with fake accounts, for working on the app or the dashboard"
run = "scripts/demo.sh"
