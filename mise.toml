# The toolchain and every task, for development and CI alike.

[tools]
rust = { version = "1.99", components = "clippy,rustfmt" }
# Builds the web UI the binary embeds (`mise run ui`); as web/ pins it.
bun = "1.4.4"

[tasks.build]
description = "Build an optimized release binary"
run = "cargo build --release --locked"

[tasks.check]
description = "Format check, lint, and test"
run = [{ task = "lint" }, { task = "test" }]

# CI runs these two as separate jobs: each builds the workspace its own way
# (clippy only checks it; the tests compile it), so side by side they take
# as long as the slower one rather than both.
[tasks.lint]
description = "Format check and lint"
run = [
  "cargo fmt --all --check",
  "cargo clippy --all-targets --all-features --locked -- -D warnings",
]

[tasks.test]
description = "Run the tests"
run = [
  "cargo test --locked",
  # Day boundaries across a daylight saving change, in a zone that has one.
  "TZ=America/New_York cargo test --locked -p slopmax-common local_midnight",
]
# Windows has no TZ database for the daylight saving check.
run_windows = "cargo test --locked --no-fail-fast"

[tasks.web]
description = "Check the web UI and @slopmax/client: format, types, lint, tests, and the contract fixtures"
dir = "web"
run = "mise run check"

[tasks.ui]
description = "Build the web UI the binary embeds, into web/apps/ui/dist/rust"
dir = "web"
run = ["bun install --frozen-lockfile", "bun apps/ui/build.ts --rust"]

[tasks.msrv]
description = "Check that the minimum supported Rust version still builds"
tools = { rust = "1.91" }
run = "cargo check --all-targets --all-features --locked"

[tasks.budget]
description = "Hold the binary's dependencies to 130 crates and the binary to 12 MiB"
run = '''
host=$(rustc -vV | sed -n 's/host: //p')
# Third-party crates only: slopmax's own (path) crates are left out.
crates=$(cargo tree --locked --color never -e normal --target "$host" --prefix none -p slopmax | sed 's/ (\*)//' | grep -v ' (/' | sort -u)
count=$(printf '%s\n' "$crates" | wc -l | tr -d ' ')
echo "$count crates for $host (budget 130)"
[ "$count" -le 130 ] || { printf '%s\n' "$crates"; exit 1; }
cargo build --release --locked -p slopmax
bytes=$(wc -c < target/release/slopmax | tr -d ' ')
# 12 MiB. v0.3.0 measured 6.52 MB and the typed API added 0.39 MB (the 7 MiB
# of phase 3). Phase 4 made the CLI a client of that API (D6), decoding the
# API's types through slopmax-client (about 0.6 MB), and added the history
# index (0.13 MB): 8.13 MB. Retiring /slopmax/* saved 0.17 MB; splitting
# slopmax-daemon from the engine cost 0.45 MB, as each crate compiles its
# own copies of the generic code it uses (serde, tokio, hyper), which LTO
# cannot merge on stable Rust: 8.48 MB. The tailnet hub brought it to
# 9.39 MB, and the pool forecast, the request history and their API types
# to 9.62 MB, past 9 MiB: raised to 10 MiB. The command line on usage-rs
# (its parser, help, completions and spec, 3 crates) and its new commands
# took it to 10.27 MB. The terminal UI (ratatui, crossterm, tachyonfx and
# terminal-colorsaurus: 56 crates, most of them ratatui's layout solver,
# derive and string helpers and tachyonfx's builder macros) took it to
# 11.83 MB, past 11 MiB: raised to 12 MiB, and the crates to 130. Raising
# either needs the reason in the commit.
echo "$bytes bytes (budget 12582912)"
[ "$bytes" -le 12582912 ]
'''

[tasks.cli-docs]
description = "Lint the command line's usage spec and write the CLI reference from it"
# The spec is docs/cli/slopmax.usage.kdl, which a test keeps in step with
# the binary (`SLOPMAX_BLESS=1 cargo test -p slopmax` writes it).
tools = { usage = "7.3.0" }
run = [
  "usage lint docs/cli/slopmax.usage.kdl",
  "usage generate markdown --file docs/cli/slopmax.usage.kdl --indented-blocks-to-code-fences --out-file docs/cli/README.md",
]

[tasks.windows-env]
description = "On a Linux CI runner: set up a Windows release build with cargo-xwin, in $GITHUB_ENV and $GITHUB_PATH"
usage = 'arg "<target>" help="x86_64-pc-windows-msvc or aarch64-pc-windows-msvc"'
tools = { "github:rust-cross/cargo-xwin" = "0.23.1" }
# The clang backend: ring builds arm64 Windows with plain clang, which the
# clang-cl backend's flags break, and its Windows SDK downloads in about 25
# seconds where the clang-cl backend's took over 8 minutes. Its C runtime and
# SDK libraries, which go into slopmax.exe, are one release of
# windows-msvc-sysroot, checked against its SHA-256, never just the latest.
env = { XWIN_CROSS_COMPILER = "clang", SYSROOT_URL = "https://github.com/trcrsired/windows-msvc-sysroot/releases/download/2026-11-06/windows-msvc-sysroot.tar.xz", SYSROOT_SHA256 = "563baf83e7dd48569b83fa104936d9d8819cc8db905e29c541b951e1eeaf2913" }
run = '''
: "${GITHUB_ENV:?is for a CI runner, where GITHUB_ENV is set}"
# The runner's newest whole LLVM: clang, lld-link, llvm-lib, and the
# llvm-rc that gives slopmax.exe its icon (build.rs).
llvm=
for bin in $(ls -d /usr/lib/llvm-*/bin 2>/dev/null | sort -V); do
  if [ -x "$bin/clang" ] && [ -x "$bin/lld-link" ] && [ -x "$bin/llvm-lib" ] && [ -x "$bin/llvm-rc" ]; then
    llvm=$bin
  fi
done
[ -n "$llvm" ] || { echo "no LLVM in /usr/lib/llvm-* has clang, lld-link, llvm-lib and llvm-rc" >&2; exit 1; }
echo "$llvm" >> "$GITHUB_PATH"
# The sysroot where cargo-xwin looks first, with the DONE it leaves there.
export XWIN_CACHE_DIR="$HOME/.cache/cargo-xwin" XWIN_MSVC_SYSROOT_DOWNLOAD_URL="$SYSROOT_URL"
sysroot="$XWIN_CACHE_DIR/windows-msvc-sysroot"
if [ ! -f "$sysroot/DONE" ]; then
  # One command a line: errexit skips a failure before a && or ||.
  rm -rf "$sysroot"
  mkdir -p "$sysroot"
  curl -fsSL --retry 3 -o "$sysroot.tar.xz" "$SYSROOT_URL"
  echo "$SYSROOT_SHA256  $sysroot.tar.xz" | sha256sum -c -
  tar -xJf "$sysroot.tar.xz" -C "$sysroot"
  rm "$sysroot.tar.xz"
  echo "$SYSROOT_URL" > "$sysroot/DONE"
fi
exports=$(PATH="$llvm:$PATH" cargo xwin env --target "$usage_target")
# The compiler, linker, and SDK settings, without the Wine test runner or
# the PATH and RUSTFLAGS cargo-xwin would replace.
printf '%s\n' "$exports" \
  | sed -nE 's/^export ([A-Za-z0-9_]+)="(.*)";$/\1=\2/p' \
  | grep -vE '^(PATH|RUSTFLAGS|CARGO_TARGET_[A-Z0-9_]+_RUNNER)=' >> "$GITHUB_ENV"
'''

[tasks.launchd]
description = "On a macOS CI runner: the login agent under launchd, through a crash, a handoff, stop and start"
run = ["cargo build -p slopmax --locked", "scripts/launchd-check.sh"]

[tasks.bench]
description = "Measure the latency, throughput, memory, and startup slopmax adds"
tools = { oha = "1.16", jq = "1.8", hyperfine = "1.20" }
run = "scripts/bench.sh"

[tasks.install-script]
description = "Lint install.sh as POSIX sh, then install the latest release with it into a scratch directory"
tools = { shellcheck = "0.11.0" }
# Plain ASCII: macOS's /bin/sh (bash 3.2) under a UTF-8 locale reads a
# multibyte character right after `$name` as part of the name.
run = '''
shellcheck -s sh install.sh
if LC_ALL=C grep -n '[^ -~	]' install.sh; then echo "install.sh must be plain ASCII" >&2; exit 1; fi
dir=$(mktemp -d)
trap 'rm -rf "$dir"' EXIT
LC_ALL=en_US.UTF-8 SLOPMAX_INSTALL_DIR="$dir" /bin/sh install.sh
"$dir/slopmax" --version
'''

[tasks.install]
description = "Install slopmax, with its web UI, into ~/.cargo/bin"
# Without the UI, the binary's dashboard is a page saying how to build it.
depends = ["ui"]
run = "cargo install --path crates/slopmax --locked"

[tasks.demo]
description = "Run a throwaway slopmax with fake accounts, for working on the dashboard"
run = "scripts/demo.sh"
