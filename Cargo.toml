[package]
name = "slopmax"
version = "0.2.0"
edition = "2024"
rust-version = "1.89"
description = "Lightweight multi-account switcher and proxy for Claude Code and Codex"
license = "MIT"
repository = "https://github.com/KaBankz/slopmax"
readme = "README.md"
keywords = ["claude", "codex", "proxy", "oauth", "cli"]
categories = ["command-line-utilities"]

[dependencies]
anyhow = "1.0.104"
base64 = "0.23.1"
bytes = "1.12.1"
http = "1.5.0"
http-body-util = "0.1.5"
hyper = { version = "1.11.1", features = ["http1", "client", "server"] }
hyper-rustls = { version = "0.27.10", default-features = false, features = ["http1", "ring", "tls12"] }
hyper-util = { version = "0.1.21", features = ["client-legacy", "http1", "tokio"] }
memchr = "2.8.3"
ring = "0.17.14"
rustls = { version = "0.23.45", default-features = false, features = ["ring", "std", "tls12"] }
rustls-native-certs = "0.8.4"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = { version = "1.0.151", features = ["preserve_order"] }
tokio = { version = "1.53.2", features = ["rt-multi-thread", "macros", "net", "signal", "time", "sync", "fs", "process", "io-util", "io-std"] }
toml_edit = { version = "0.25.15", features = ["serde"] }
tower-service = "0.3.3"

[target.'cfg(unix)'.dependencies]
libc = "0.2.190"

[dev-dependencies]
tokio = { version = "1.53.2", features = ["test-util"] }

[profile.release]
lto = "fat"
codegen-units = 1
strip = true
