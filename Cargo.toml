[workspace]
members = ["crates/*"]
# A plain `cargo build`, `test`, or `clippy` covers the CLI and the
# libraries, the app's included; the desktop app is built on its own, as it
# needs a GUI toolkit and the system libraries under it.
default-members = [
  "crates/slopmax",
  "crates/slopmax-api",
  "crates/slopmax-app",
  "crates/slopmax-client",
  "crates/slopmax-common",
  "crates/slopmax-core",
  "crates/slopmax-daemon",
  "crates/slopmax-net",
  "crates/slopmax-wire",
]
resolver = "3"

[workspace.package]
version = "0.4.2"
edition = "2024"
rust-version = "1.89"
license = "MIT"
repository = "https://github.com/KaBankz/slopmax"

[workspace.dependencies]
slopmax-api = { path = "crates/slopmax-api" }
slopmax-app = { path = "crates/slopmax-app" }
slopmax-client = { path = "crates/slopmax-client" }
slopmax-common = { path = "crates/slopmax-common" }
slopmax-core = { path = "crates/slopmax-core" }
slopmax-daemon = { path = "crates/slopmax-daemon" }
slopmax-net = { path = "crates/slopmax-net" }
slopmax-wire = { path = "crates/slopmax-wire" }

anyhow = "1.0.104"
base64 = "0.23.1"
bytes = "1.12.1"
http = "1.5.0"
http-body-util = "0.1.5"
hyper = { version = "1.11.1", features = ["http1", "client", "server"] }
hyper-rustls = { version = "0.27.10", default-features = false, features = ["http1", "ring", "tls12"] }
hyper-util = { version = "0.1.21", features = ["client-legacy", "http1", "tokio"] }
libc = "0.2.190"
memchr = "2.8.3"
proptest = { version = "1.12.0", default-features = false, features = ["std"] }
mimalloc = { version = "0.1.52", default-features = false }
ring = "0.17.14"
rustls = { version = "0.23.46", default-features = false, features = ["ring", "std", "tls12"] }
rustls-native-certs = "0.8.4"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = { version = "1.0.151", features = ["preserve_order"] }
thiserror = "2.0.21"
tokio = { version = "1.53.2", features = ["rt-multi-thread", "macros", "net", "signal", "time", "sync", "fs", "process", "io-util", "io-std"] }
toml_edit = { version = "0.25.15", features = ["serde"] }
tokio-util = { version = "0.7.19", default-features = false, features = ["rt"] }
tower-service = "0.3.3"

[workspace.lints.rust]
# Unsafe code lives in four places, each allowed where it is written: the
# local time offset (slopmax-common), turning off terminal echo for secrets
# (the CLI), keeping the CLI's standard handles out of the background proxy on
# Windows (the CLI), and making refused local connections fail at once on
# Windows (slopmax-net).
unsafe_code = "deny"

# A desktop UI lays out and draws every frame on the CPU: unoptimized, a GPUI
# frame takes 50-110 ms, optimized under 5. Dependencies build optimized once
# and stay cached, so only a clean build is slower; slopmax's own crates
# still rebuild as fast.
[profile.dev.package."*"]
opt-level = 2

[profile.release]
lto = "fat"
codegen-units = 1
strip = true

# For perf and flamegraphs: release speed, with symbols and line tables.
[profile.profiling]
inherits = "release"
lto = "thin"
codegen-units = 16
strip = false
debug = "line-tables-only"
