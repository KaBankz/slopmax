[package]
name = "slopmax"
version = "0.1.0"
edition = "2024"
rust-version = "1.89"
description = "Lightweight multi-account switcher and proxy for Claude Code and Codex"
license = "MIT"
repository = "https://github.com/KaBankz/slopmax"
readme = "README.md"
keywords = ["claude", "codex", "proxy", "oauth", "cli"]
categories = ["command-line-utilities"]

[dependencies]
anyhow = "1.0.104"
axum = { version = "0.8.9", default-features = false, features = ["http1", "tokio", "json", "query"] }
base64 = "0.23.1"
bytes = "1.12.1"
clap = { version = "4.6.7", features = ["derive", "env"] }
futures-util = "0.3.34"
getrandom = "0.4.3"
http = "1.5.0"
reqwest = { version = "0.13.5", default-features = false, features = ["rustls-no-provider", "http2", "json", "stream"] }
rustls = { version = "0.23.45", default-features = false, features = ["ring", "std", "tls12"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = { version = "1.0.151", features = ["preserve_order"] }
sha2 = "0.11.0"
tokio = { version = "1.53.2", features = ["rt-multi-thread", "macros", "net", "signal", "time", "sync", "fs", "process", "io-util", "io-std"] }
toml = "1.1.6"
toml_edit = "0.25.15"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
url = "2.5.8"

[profile.release]
lto = "fat"
codegen-units = 1
strip = true
