name: CI

# Every job runs a mise task, with the toolchain mise.toml pins, so CI
# checks exactly what `mise run <task>` checks locally.

on:
  push:
    branches: [master]
  pull_request:

env:
  CARGO_TERM_COLOR: always
  # Line numbers but no variables in debug info: backtraces stay useful, and
  # objects, test binaries and the cache are smaller, which Windows links and
  # starts noticeably faster.
  CARGO_PROFILE_DEV_DEBUG: line-tables-only

jobs:
  check:
    name: Check (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      # Windows runners keep the system drive (C:) on slower storage than the
      # workspace drive (D:). Tests and the linker write temporary files, so
      # they go on D:, as pip's and uv's CI do.
      - if: runner.os == 'Windows'
        run: |
          "TMP=$env:RUNNER_TEMP" >> $env:GITHUB_ENV
          "TEMP=$env:RUNNER_TEMP" >> $env:GITHUB_ENV
      - uses: jdx/mise-action@v5
      - uses: Swatinem/rust-cache@v2
      - run: mise run check

  msrv:
    name: Minimum Rust version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: jdx/mise-action@v5
      - uses: Swatinem/rust-cache@v2
      - run: mise run msrv

  web:
    name: Web UI
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: jdx/mise-action@v5
        with:
          working_directory: web
      - run: mise run check
        working-directory: web

  budget:
    name: Size budget
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: jdx/mise-action@v5
      - uses: Swatinem/rust-cache@v2
      - run: mise run budget
