name: CI

# Every job runs a mise task, with the toolchain mise.toml pins, so CI
# checks exactly what `mise run <task>` checks locally.

on:
  push:
    branches: [master]
  pull_request:

env:
  CARGO_TERM_COLOR: always
  # Line numbers but no variables in debug info: backtraces stay useful, and
  # objects, test binaries and the cache are smaller, which Windows links and
  # starts noticeably faster.
  CARGO_PROFILE_DEV_DEBUG: line-tables-only

jobs:
  check:
    name: ${{ matrix.task == 'lint' && 'Lint' || 'Test' }} (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        # Clippy and the tests build the workspace two different ways, so as
        # separate jobs they take as long as the slower one, not the two
        # together: about 40 seconds off Windows and macOS.
        task: [lint, test]
    steps:
      - uses: actions/checkout@v7
      # Windows runners keep the system drive (C:) on slower storage than the
      # workspace drive (D:). Tests and the linker write temporary files, so
      # they go on D:, as pip's and uv's CI do.
      - if: runner.os == 'Windows'
        run: |
          "TMP=$env:RUNNER_TEMP" >> $env:GITHUB_ENV
          "TEMP=$env:RUNNER_TEMP" >> $env:GITHUB_ENV
      - uses: jdx/mise-action@v5
      - uses: Swatinem/rust-cache@v2
        with:
          # Clippy's and the tests' builds share nothing, so each keeps its own.
          key: ${{ matrix.task }}
      - run: mise run ${{ matrix.task }}

  launchd:
    name: Login agent (macOS)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
      - uses: jdx/mise-action@v5
      - uses: Swatinem/rust-cache@v2
      - run: mise run launchd

  msrv:
    name: Minimum Rust version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: jdx/mise-action@v5
      - uses: Swatinem/rust-cache@v2
      - run: mise run msrv

  web:
    name: Web UI
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: jdx/mise-action@v5
        with:
          working_directory: web
      - run: mise run check
        working-directory: web

  cli-docs:
    name: CLI reference
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: jdx/mise-action@v5
      - run: mise run cli-docs
      - run: git diff --exit-code docs/cli

  budget:
    name: Size budget
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: jdx/mise-action@v5
      - uses: Swatinem/rust-cache@v2
      - run: mise run budget

  install-script:
    name: Install script (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # macOS's /bin/sh is bash 3.2, the strictest about what it runs.
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v7
      - uses: jdx/mise-action@v5
      # A published release: `latest` lacks its archives for the few
      # minutes a new release takes to build.
      - run: mise run install-script
        env:
          SLOPMAX_VERSION: v0.18.2
