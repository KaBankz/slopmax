name: CI

on:
  push:
    branches: [master]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    name: Check (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy --all-targets --locked -- -D warnings
      - run: cargo test --locked

  msrv:
    name: Minimum Rust version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.89
      - uses: Swatinem/rust-cache@v2
      - run: cargo check --locked

  budget:
    name: Size budget
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Dependencies stay few
        run: |
          host=$(rustc -vV | sed -n 's/host: //p')
          cargo tree --locked -e normal --target "$host" --prefix none | sed 's/ (\*)//' | sort -u > crates.txt
          echo "$(wc -l < crates.txt) crates for $host"
          test "$(wc -l < crates.txt)" -le 70 || { cat crates.txt; exit 1; }
      - name: The binary stays small
        run: |
          cargo build --release --locked
          bytes=$(stat -c %s target/release/slopmax)
          echo "$bytes bytes"
          test "$bytes" -le 6291456
