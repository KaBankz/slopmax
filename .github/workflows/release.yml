name: Release

on:
  push:
    tags: ["v*"]
  # A manual run builds every target without publishing anything, to check
  # the release before tagging one.
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: taiki-e/create-gh-release-action@v1
        with:
          changelog: CHANGELOG.md
          token: ${{ secrets.GITHUB_TOKEN }}

  binaries:
    needs: release
    # Runs after the release is created, or alone in a manual run.
    if: ${{ !failure() && !cancelled() }}
    name: ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { target: x86_64-unknown-linux-musl, os: ubuntu-latest }
          - { target: aarch64-unknown-linux-musl, os: ubuntu-latest }
          - { target: x86_64-apple-darwin, os: macos-latest }
          - { target: aarch64-apple-darwin, os: macos-latest }
    steps:
      - uses: actions/checkout@v4
      # The Rust that mise.toml pins, as in development and CI.
      - uses: jdx/mise-action@v5
      - uses: taiki-e/upload-rust-binary-action@v1
        with:
          bin: slopmax
          target: ${{ matrix.target }}
          archive: slopmax-$target
          checksum: sha256
          dry-run: ${{ github.event_name != 'push' }}
          dry-run-intended: ${{ github.event_name != 'push' }}
          token: ${{ secrets.GITHUB_TOKEN }}
