[package]
name = "slopmax-desktop-gpui"
description = "The slopmax desktop app, drawn with GPUI"
version.workspace = true
edition.workspace = true
# What GPUI's snapshot builds with.
rust-version = "1.92"
license.workspace = true
repository.workspace = true
publish = false

[features]
# Draws each page to an image, without a screen, for reviewing the design:
# run with SLOPMAX_SHOTS naming a directory, and the app quits once done.
shots = ["gpui-kit/test-support"]

[dependencies]
anyhow.workspace = true
# Carries clicks outside the app, which AppKit sees, to the menu bar panel.
async-channel = "2"
gpui-kit = "0.7"
gpui-tray = { version = "0.1.4", default-features = false, features = ["gpui-kit"] }
# The window's settings, kept in slopmax's home on every system.
serde.workspace = true
serde_json.workspace = true
slopmax-app.workspace = true
slopmax-core.workspace = true

# What GPUI does not reach of AppKit: where the menu bar item sits, its
# template image, which gpui-tray cannot set, and clicks in other apps.
[target.'cfg(target_os = "macos")'.dependencies]
block2 = "0.6"
objc2 = "0.6"
objc2-app-kit = { version = "0.3", default-features = false, features = [
  "std",
  "block2",
  "objc2-core-foundation",
  "NSApplication",
  "NSButton",
  "NSControl",
  "NSEvent",
  "NSImage",
  "NSResponder",
  "NSScreen",
  "NSStatusBarButton",
  "NSView",
  "NSWindow",
] }
objc2-foundation = { version = "0.3", default-features = false, features = [
  "std",
  "NSArray",
  "NSBundle",
  "NSEnumerator",
  "NSError",
  "NSString",
] }
# Nudges as the system's own notifications.
objc2-user-notifications = { version = "0.3", default-features = false, features = [
  "std",
  "bitflags",
  "block2",
  "UNNotificationContent",
  "UNNotificationRequest",
  "UNNotificationSound",
  "UNNotificationTrigger",
  "UNUserNotificationCenter",
] }

[lints]
workspace = true
