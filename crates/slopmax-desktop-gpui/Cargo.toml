[package]
name = "slopmax-desktop-gpui"
description = "The slopmax desktop app drawn with GPUI, one of the two UIs under evaluation"
version.workspace = true
edition.workspace = true
# What GPUI's snapshot builds with.
rust-version = "1.92"
license.workspace = true
repository.workspace = true
publish = false

[dependencies]
anyhow.workspace = true
gpui-kit = "0.7"
gpui-tray = { version = "0.1.4", default-features = false, features = ["gpui-kit"] }
slopmax-app.workspace = true
slopmax-core.workspace = true

# The system's accent color, which GPUI does not pass on, and the menu bar
# item's template image, which gpui-tray cannot set.
[target.'cfg(target_os = "macos")'.dependencies]
block2 = "0.6"
objc2 = "0.6"
objc2-app-kit = { version = "0.3", default-features = false, features = [
  "std",
  "block2",
  "objc2-core-foundation",
  "NSAppearance",
  "NSApplication",
  "NSButton",
  "NSColor",
  "NSColorSpace",
  "NSControl",
  "NSImage",
  "NSResponder",
  "NSStatusBarButton",
  "NSView",
  "NSWindow",
] }
objc2-foundation = { version = "0.3", default-features = false, features = [
  "std",
  "NSArray",
  "NSEnumerator",
  "NSString",
] }

[lints]
workspace = true
