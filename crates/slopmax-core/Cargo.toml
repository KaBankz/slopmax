[package]
name = "slopmax-core"
description = "slopmax's engine: accounts, sign-in, the providers, the pool, the ledger and the report"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[dependencies]
anyhow.workspace = true
base64.workspace = true
http.workspace = true
# SHA-256 of downloaded releases; already rustls's.
ring.workspace = true
serde.workspace = true
serde_json.workspace = true
slopmax-api.workspace = true
# How the CLI reaches a daemon that runs, through its API.
slopmax-client.workspace = true
slopmax-common.workspace = true
slopmax-net.workspace = true
slopmax-wire.workspace = true
# Routing plans held inline: no heap allocation for a request's steps.
smallvec.workspace = true
thiserror.workspace = true
tokio.workspace = true
tokio-util.workspace = true
toml_edit.workspace = true

[lints]
workspace = true

[dev-dependencies]
# The bodies of the stand-in servers in tests.
bytes.workspace = true
# Release archives built in tests.
flate2.workspace = true
# Paused time, for timeouts tested without waiting them out.
tokio = { workspace = true, features = ["test-util"] }
