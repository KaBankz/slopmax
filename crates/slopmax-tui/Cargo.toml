[package]
name = "slopmax-tui"
description = "slopmax's terminal UI: the dashboard's pages in a terminal, over slopmax's API"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false

# ratatui and tachyonfx are before 1.0 and change their APIs between minor
# releases, so the terminal crates are pinned exactly.
[dependencies]
anyhow.workspace = true
crossterm = { version = "=0.29.0", features = ["event-stream"] }
futures-core = "0.3.34"
ratatui = { version = "=0.30.2", default-features = false, features = ["crossterm", "layout-cache", "underline-color"] }
slopmax-client.workspace = true
slopmax-common.workspace = true
tachyonfx = { version = "=0.25.2", default-features = false, features = ["std"] }
terminal-colorsaurus = "=1.0.3"
tokio.workspace = true

[dev-dependencies]
insta = "=1.49.0"
serde.workspace = true
serde_json.workspace = true

[lints]
workspace = true
